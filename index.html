   <audio id="ambient-wave" src="https://github.com/hyuxuan0717-dev/yuxuanhe-portfolio/releases/download/portfolio-media-v1/background.wave.wav" loop preload="auto"></audio>
<audio id="ambient-forest" src="https://github.com/hyuxuan0717-dev/yuxuanhe-portfolio/releases/download/portfolio-media-v1/forest.mp3" loop preload="auto"></audio>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        let siteLanguage = 'zh';
        const signTextureRedrawers = [];
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508); // Dark night sky
        scene.fog = new THREE.FogExp2(0x050508, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Camera-mounted sky elements are rendered only when the camera is in the scene graph.
        scene.add(camera);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        // Filmic tone mapping helps glowing elements look better
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Very dim ambient light for night
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.05);
        scene.add(ambientLight);

        // Moonlight (weak directional light)
        const dirLight = new THREE.DirectionalLight(0xaaccff, 0.15);
        dirLight.position.set(50, 100, 30);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 10;
        dirLight.shadow.camera.far = 200;
        dirLight.shadow.camera.left = -70;
        dirLight.shadow.camera.right = 70;
        dirLight.shadow.camera.top = 70;
        dirLight.shadow.camera.bottom = -70;
        dirLight.shadow.bias = -0.001;
        scene.add(dirLight);

        // STRICTLY Grayscale for infrastructure
        const mats = {
            ocean: new THREE.MeshStandardMaterial({ color: 0x111827, emissive: 0x062b48, emissiveIntensity: 0.72, roughness: 0.18, metalness: 0.65, flatShading: true }),
            beach: new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 }),
            grass: new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 1.0 }),
            path: new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8, flatShading: true }),
            wood: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 }),
            pineLeaves: new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.9, flatShading: true }),
            bushLeaves: new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.8, flatShading: true }),
            trunk: new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 1.0 }),
            catBody: new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.5 }),
            sail: new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.8, side: THREE.DoubleSide }),
            lampPole: new THREE.MeshStandardMaterial({ color: 0x0f0f0f, roughness: 0.6 }),
            flowerPetal: new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 1.0, flatShading: true })
        };

        // Ocean
        const oceanGeo = new THREE.PlaneGeometry(400, 400, 60, 60);
        const oceanPosAttribute = oceanGeo.attributes.position;
        const oceanInitZ = [];
        for (let i = 0; i < oceanPosAttribute.count; i++) {
            oceanInitZ.push(oceanPosAttribute.getZ(i));
        }
        const ocean = new THREE.Mesh(oceanGeo, mats.ocean);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.y = -2;
        ocean.receiveShadow = true;
        scene.add(ocean);

        // Soft, scattered moonlit glints riding over the waves.
        const seaGlintCount = 260;
        const seaGlintPositions = new Float32Array(seaGlintCount * 3);
        const seaGlints = [];
        for (let i = 0; i < seaGlintCount; i++) {
            const x = (Math.random() - 0.5) * 390;
            const z = (Math.random() - 0.5) * 390;
            seaGlintPositions[i * 3] = x;
            seaGlintPositions[i * 3 + 1] = 0;
            seaGlintPositions[i * 3 + 2] = z;
            seaGlints.push({ x, z, phase: Math.random() * Math.PI * 2, scale: 0.5 + Math.random() * 1.5 });
        }
        const seaGlintGeo = new THREE.BufferGeometry();
        seaGlintGeo.setAttribute('position', new THREE.BufferAttribute(seaGlintPositions, 3));
        const seaGlintMat = new THREE.PointsMaterial({ color: 0x55dfff, size: 1.25, transparent: true, opacity: 0.48, blending: THREE.AdditiveBlending, depthWrite: false });
        const seaGlintsMesh = new THREE.Points(seaGlintGeo, seaGlintMat);
        seaGlintsMesh.position.y = -2;
        scene.add(seaGlintsMesh);

        // Island (Circular/Oval diorama base)
        const islandGroup = new THREE.Group();
        
        const beachRadius = 45;
        const beach = new THREE.Mesh(new THREE.CylinderGeometry(beachRadius, beachRadius + 2, 2, 64), mats.beach);
        beach.position.y = -1;
        beach.receiveShadow = true;
        islandGroup.add(beach);

        const grassRadius = 41;
        const grass = new THREE.Mesh(new THREE.CylinderGeometry(grassRadius, grassRadius + 2, 1.5, 64), mats.grass);
        grass.position.y = 0.5;
        grass.receiveShadow = true;
        grass.castShadow = true;
        islandGroup.add(grass);
        
        scene.add(islandGroup);

        // Pier
        const pierZ = 43;
        const pier = new THREE.Group();
        const deck = new THREE.Mesh(new THREE.BoxGeometry(6, 0.5, 18), mats.wood);
        deck.position.set(0, 0, pierZ);
        deck.castShadow = true;
        deck.receiveShadow = true;
        pier.add(deck);
        
        for(let z of [pierZ - 8, pierZ, pierZ + 8]) {
            for(let x of [-2.5, 2.5]) {
                const post = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 4), mats.wood);
                post.position.set(x, -1, z);
                post.castShadow = true;
                pier.add(post);
            }
        }
        scene.add(pier);

        // Boat
        const boatGroup = new THREE.Group();
        const hull = new THREE.Mesh(new THREE.BoxGeometry(5, 2, 10), mats.wood);
        hull.position.y = 0.5;
        hull.castShadow = true;
        
        const bow = new THREE.Mesh(new THREE.CylinderGeometry(0, 2.5, 5, 3), mats.wood);
        bow.rotation.x = Math.PI / 2;
        bow.rotation.y = -Math.PI / 6;
        bow.position.set(0, 0.5, -6.5);
        bow.castShadow = true;

        const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 8), mats.wood);
        mast.position.set(0, 5, 0);
        mast.castShadow = true;
        
        const sail = new THREE.Mesh(new THREE.ConeGeometry(3, 7, 3), mats.sail);
        sail.position.set(0, 5, -1);
        sail.rotation.y = Math.PI;
        sail.castShadow = true;
        
        boatGroup.add(hull);
        boatGroup.add(bow);
        boatGroup.add(mast);
        boatGroup.add(sail);
        
        const boatStartZ = pierZ + 70;
        const boatDockZ = pierZ + 12;
        boatGroup.position.set(0, -1, boatStartZ);
        scene.add(boatGroup);

        // Cat Character
        const catGroup = new THREE.Group();
        const catBody = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.7, 1.4, 16), mats.catBody);
        catBody.rotation.x = Math.PI / 2;
        catBody.position.y = 0.8;
        catBody.castShadow = true;
        catGroup.add(catBody);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 32), mats.catBody);
        head.position.set(0, 1.5, -0.7);
        head.castShadow = true;
        catGroup.add(head);

        const earGeo = new THREE.ConeGeometry(0.25, 0.6, 16);
        const earL = new THREE.Mesh(earGeo, mats.catBody);
        earL.position.set(-0.35, 2.0, -0.6);
        earL.rotation.set(0.2, 0, 0.2);
        catGroup.add(earL);
        const earR = new THREE.Mesh(earGeo, mats.catBody);
        earR.position.set(0.35, 2.0, -0.6);
        earR.rotation.set(0.2, 0, -0.2);
        catGroup.add(earR);

        const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 1.5, 8), mats.catBody);
        tail.position.set(0, 1.0, 1.0);
        tail.rotation.x = -Math.PI / 3;
        catGroup.add(tail);

        // Spotlights Eyes (Colorful)
        const eyeColor = 0x00ffff; // Cyan piercing eyes
        const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshBasicMaterial({color: eyeColor}));
        eyeL.position.set(-0.3, 1.5, -1.3);
        catGroup.add(eyeL);
        const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshBasicMaterial({color: eyeColor}));
        eyeR.position.set(0.3, 1.5, -1.3);
        catGroup.add(eyeR);

        const lightTarget = new THREE.Object3D();
        scene.add(lightTarget);

        // Stronger spotlights for night exploration
        const spotLightL = new THREE.SpotLight(eyeColor, 8, 60, Math.PI / 6, 0.5, 1.5);
        const spotLightR = new THREE.SpotLight(eyeColor, 8, 60, Math.PI / 6, 0.5, 1.5);
        spotLightL.position.copy(eyeL.position);
        spotLightR.position.copy(eyeR.position);
        spotLightL.target = lightTarget;
        spotLightR.target = lightTarget;
        spotLightL.castShadow = true;
        spotLightR.castShadow = true;
        catGroup.add(spotLightL);
        catGroup.add(spotLightR);
        
        scene.add(catGroup);
        catGroup.visible = false;

        // Cat MUST start exactly on the boat
        const catBoatOffsetY = 1.6; // Deck height
        catGroup.position.set(0, catBoatOffsetY - 1, boatStartZ);

        // 3 Paths
        const pathControlPoints = [
            [ new THREE.Vector3(0, 1.3, pierZ - 10), new THREE.Vector3(-12, 1.3, 20), new THREE.Vector3(-25, 1.3, 15), new THREE.Vector3(-15, 1.3, -5), new THREE.Vector3(-32, 1.3, -20) ], // Left
            [ new THREE.Vector3(0, 1.3, pierZ - 10), new THREE.Vector3(8, 1.3, 15), new THREE.Vector3(-10, 1.3, 0), new THREE.Vector3(5, 1.3, -15), new THREE.Vector3(0, 1.3, -32) ],   // Center
            [ new THREE.Vector3(0, 1.3, pierZ - 10), new THREE.Vector3(15, 1.3, 25), new THREE.Vector3(30, 1.3, 5), new THREE.Vector3(15, 1.3, -10), new THREE.Vector3(32, 1.3, -18) ]    // Right
        ];
        // Pull portfolio paths farther into the island while leaving the pier entrance fixed.
        const branchSpacing = [-8, 0, 8];
        pathControlPoints.forEach((path, pathIndex) => {
            for (let i = 1; i < path.length; i++) {
                path[i].x *= 0.68;
                path[i].z *= 0.68;
                path[i].x += branchSpacing[pathIndex];
            }
        });
        const pathCurves = pathControlPoints.map(pts => new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.8));
        const allPathPoints = [];

        pathCurves.forEach(curve => {
            const points = curve.getPoints(50);
            points.forEach(p => {
                const stone = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.4, 0.2, 7), mats.path);
                stone.position.set(p.x + (Math.random()-0.5), p.y, p.z + (Math.random()-0.5));
                stone.rotation.y = Math.random() * Math.PI;
                stone.receiveShadow = true;
                scene.add(stone);
                allPathPoints.push(stone.position);
            });
        });

        // Streetlamps along paths
        const lamps = [];
        pathCurves.forEach((curve, index) => {
            // Place 3 lamps along each path
            [0.25, 0.55, 0.85].forEach(t => {
                const pt = curve.getPoint(t);
                // Offset lamp slightly to the side of the path
                const tangent = curve.getTangent(t);
                const offset = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize().multiplyScalar((index%2===0 ? 2 : -2));
                
                const lampGroup = new THREE.Group();
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 4), mats.lampPole);
                pole.position.y = 3; // base is 1, center is 3
                pole.castShadow = true;
                lampGroup.add(pole);

                const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshBasicMaterial({color: 0xffaa55}));
                bulb.position.y = 5.2;
                lampGroup.add(bulb);

        function createSignTexture(title, lines, width = 768, height = 384, glowing = false, icon = null) {
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');

            const drawText = () => {
                ctx.clearRect(0, 0, width, height); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

                ctx.fillStyle = glowing ? '#fff3d2' : '#382417';
                const localizedTitle = siteLanguage === 'zh' ? title : (lines[0] || title);
                let fontSize = Math.round(height * 0.38);
                ctx.font = `bold ${fontSize}px "ZCOOL KuaiLe Local", "PingFang SC", sans-serif`;
                const iconSize = icon ? Math.round(height * 0.22) : 0;
                const textSpace = width - 56 - (icon ? iconSize + 24 : 0);
                const measuredTitleWidth = ctx.measureText(localizedTitle).width;
                if (measuredTitleWidth > textSpace) {
                    fontSize = Math.floor(fontSize * textSpace / measuredTitleWidth);
                    ctx.font = `bold ${fontSize}px "ZCOOL KuaiLe Local", "PingFang SC", sans-serif`;
                }
                const titleY = height * 0.5;
                if (icon) {
                    const titleWidth = ctx.measureText(localizedTitle).width;
                    const totalWidth = iconSize + 15 + titleWidth;
                    const startX = (width - totalWidth) / 2;
                    drawRouteSignIcon(ctx, icon, startX + iconSize / 2, titleY, iconSize, glowing ? '#fff3d2' : '#382417');

                    ctx.strokeText(localizedTitle, startX + iconSize + 15, titleY, width - startX - iconSize - 30);
                    ctx.fillText(localizedTitle, startX + iconSize + 15, titleY, width - startX - iconSize - 30);

                    ctx.strokeStyle = glowing ? 'rgba(15,12,20,0.92)' : 'rgba(35,18,7,0.55)'; ctx.lineWidth = glowing ? 2.5 : 1.5; ctx.lineJoin = 'round';
                    ctx.strokeText(localizedTitle, width / 2, titleY, width - 56);
                    ctx.fillText(localizedTitle, width / 2, titleY, width - 56);

        const courageDescZh = "本作为“这页纸记得 叠纸游戏2026创作大赛”参赛作品\n\n\n创作背景\n本作灵感源于暖暖在《奇迹暖暖》《闪耀暖暖》《无限暖暖》三部曲中，穿越奇迹大陆后开启的那段未知而瑰丽的旅途。暖暖身处陌生世界，始终怀揣着出发的勇气与帮助他人的善意，这份特质既鼓舞了奇迹大陆的原住民们，也打动了屏幕外的玩家。本作以暖暖这场奇幻却暗藏危险的冒险旅途为基底，力求展现暖暖在拯救世界的旅程中，初遇住民、遭遇险境、战胜强敌、再度出发的勇气之路。\n\n故事简要\n用魔法穿过时空的裂隙，暖暖踏入奇迹大陆。\n这里民风淳朴，居民热情友善，她很快便卸下异乡人的拘谨，与当地居民打成一片，欢歌载舞。不料蛰伏多时的黑暗势力骤然降临，撕裂了庆典的欢腾，将恐惧与阴影洒向大地。\n暖暖为守护奇迹大陆挺身而出，以一己之身迎向汹涌暗潮。历经鏖战，她终于感悟神明的力量，在绝境中击退黑暗势力。\n当最后一缕暗影消散，阳光重新照耀大地，朋友们用最热烈的欢呼和盛大的庆典表达他们的敬意与感激。火光彻夜不息，歌声久久回荡，仿佛一切都未曾改变。\n然而远方的命运从未停止召唤，未知的谜题仍等待暖暖去解答。伙伴温柔的埙音如雾弥漫，诉说离别，亦为下一段冒险故事埋下伏笔。\n\n音乐结构\n\nA段 0:00-0:36 44拍\n前导段，描绘暖暖穿越之时。配器运用弦乐、木管、竖琴和少量打击乐器，同时大量运用好莱坞和弦营造魔法风格。以竖琴solo作为AB段的桥梁，柔和降落到异世界的草地。\n\nB段 0:36-1:41 43拍\n凯尔特风格。初到异世界。配器采用特色爱尔兰锡哨、爱尔兰竖琴、手鼓等，以打击乐solo和铜管的四次号角拉开冒险的帷幕。使用混合利底亚调式，营造轻盈和雀跃感。在推进过程中加入人声的呼喊与欢呼，展现奇迹大陆的淳朴热情民风。结尾以连续的下行音阶暗示黑暗势力的悄然降临。\n\nC段 1:41-3:12 45拍\\44拍\n风雨已来。由混合利底亚转为小调，铜管、合唱人声接管音乐，增加史诗感与紧张感。情绪在节奏型的重复和乐器逐层加入中不断推进，推向高潮后骤收，改为平稳的44拍。\n人声大意：\n黑暗已来\\何以抗争\\黑暗已来\\何以抗争\n战斗\\战斗\\守护家园\\战斗\\战斗\\怒火不息\n继承神明力量\\黑暗已来\\以此抗争\n\nB’段 3:12-3:59 43拍\n复现B段主旋律，同时调式变为利底亚调式，整体配器和声部相较B段更为丰富。结尾弱收。";
        const courageDescEn = "This work is an entry for \"This Page Remembers: Papergames 2026 Creation Contest\"\n\nCreation Background\nThis work draws inspiration from the unknown and magnificent journey that Nikki embarks on after crossing into the Miraland in the trilogy of 《Miracle Nikki》, 《Shining Nikki》 and 《Infinity Nikki》. Stranded in an unfamiliar world, Nikki always holds the courage to set out and the kindness to help others. This trait has not only inspired the indigenous people of Miraland, but also touched the players beyond the screen. Based on Nikki's fantastical yet perilous adventure, this work strives to present the courageous path Nikki takes during her journey to save the world, where she meets inhabitants for the first time, encounters dangers, defeats powerful enemies, and sets off again.\n\nStory Summary\nUsing magic to pass through the rift of time and space, Nikki steps into Miraland.\nThe local people here are honest and simple, and the residents are warm and friendly. She quickly lets go of the awkwardness of being a stranger, mingles with the local residents, singing and dancing merrily. Unexpectedly, the dark forces that have been dormant for a long time suddenly descend, tearing apart the jollity of the celebration and spreading fear and shadow across the land.\nNikki steps forward to protect Miraland, facing the surging dark tide alone. After a fierce battle, she finally comprehends the power of the deities and repels the dark forces in the desperate situation.\nWhen the last wisp of shadow dissipates and the sun shines on the earth again, friends express their respect and gratitude with the warmest cheers and a grand celebration. The fire burns all night long, and the singing lingers for a long time, as if nothing has ever changed.\nHowever, the distant fate never stops calling, and unknown puzzles still wait for Nikki to solve. The gentle sound of the xun played by her companions lingers like mist, conveying the parting and foreshadowing the next adventure story.\n\nMusic Structure\n\nSection A 0:00-0:36 4/4 \nIntroductory segment, depicting the moment when Nikki travels through time and space. Orchestration includes strings, woodwinds, harp and a small amount of percussion instruments, while a large number of Hollywood chords are used to create a magical style. A harp solo serves as the bridge between Section A and Section B, softly leading to the grassland of the other world.\n\nSection B 0:36-1:41 3/4 \nCeltic style, depicting the first arrival in the other world. Orchestration adopts characteristic Irish tin whistle, Irish harp, hand drum, etc. A percussion solo and four blasts of brass horns draw the curtain of the adventure. The Mixolydian mode is used to create a light and joyful feeling. In the progression, vocal shouts and cheers are added to show the simple and warm folk customs of Miraland. The ending uses a continuous descending scale to imply the quiet arrival of the dark forces.\n\nSection C 1:41-3:12 5/4 and 4/4 \nThe storm has arrived. The mode shifts from Mixolydian to minor, with brass and chorus vocals taking over the music, enhancing the epic and tense atmosphere. The emotion keeps building up through the repetition of rhythmic patterns and the gradual addition of instruments, then cuts off abruptly after reaching the climax, switching to a steady 4/4 time signature.\n\nGeneral meaning of the vocals:\nDarkness has come \\ How can we fight back \\ Darkness has come \\ How can we fight back\nFight \\ Fight \\ Guard our home \\ Fight \\ Fight \\ Wrath never ceases\nInherit the power of the deities \\ Darkness has come \\ Fight back with this power\n\nSection B' 3:12-3:59 3/4 \nReprises the main melody of Section B, while the mode changes to Lydian, and the overall orchestration and vocal parts are richer than those of Section B. The section ends with a fade-out.";
        const odeDescZh = "本作为“这页纸记得 叠纸游戏2026创作大赛”参赛作品\n\n\n背景介绍\n\n一 关卡玩法\n\n玩家战胜小怪进入BOSS房，战胜BOSS后取得胜利\n\n二 剧情叙事\n\n虔诚的信徒通过弹奏管风琴来歌颂他们的造物主，他们的琴声和歌声通过音箱永不停歇的扩音传到世界各地，但音箱因为不停工作罢工造反，反而控制信徒攻击前来修理音箱的主角。\n\n三 美术风格\n\n整体为黄铜+蒸汽机械质感，小怪、音箱BOSS、平台等物体均为黄铜制造，蒸汽驱动。\n特殊说明：\n· 小怪弹奏管风琴\n· 平台为蒸汽支撑，在踏上\\离开时会放气\\充气\n· BOSS发射蒸汽弹\n· 其他音效说明详见视频\n\n\n注：篇幅限制并未在此简介展示更多音乐音效思路介绍，详情可点击下方链接访问此作品ggac官网获取详细说明";
        const odeDescEn = "This work is an entry for \"This Page Remembers: Papergames 2026 Creation Contest\"\n\nBackground Introduction\n\nI. Level Gameplay\n\nPlayers defeat minions to enter the BOSS room, and win the victory after defeating the BOSS.\n\nII. Plot Narrative\n\nDevout believers sing praises to their Creator by playing the pipe organ. Their music and singing are continuously amplified through speakers and spread to all parts of the world. However, the speakers go on strike and rebel due to non-stop operation, and instead control the believers to attack the protagonist who comes to repair the speakers.\n\nIII. Art Style\n\nThe overall style features brass + steam mechanical texture. Minions, speaker BOSS, platforms and other objects are all made of brass and driven by steam.\n\nSpecial Notes:\n\nMinions play the pipe organ. The platform is supported by steam, which will deflate\\inflate when stepped on\\left. The BOSS launches steam bombs. For other sound effect descriptions, please refer to the video for details.\n\nNote: Due to space limitations, more ideas about music and sound effects are not shown in this introduction. For details, you can click the link below to visit the official GGAC website of this work for detailed descriptions.";
        const cosmicDescZh = "本作为“Ludum Dare 59”参赛作品\n\n\n背景介绍\n\n一 关卡玩法\n\n玩家通过操纵飞船在太空捡垃圾并售卖，换取妻子遗留下来的信息与自己的记忆\n\n二 剧情叙事\n\n玩家为在太空进行垃圾回收的飞船员工，已经身患重病，在完成此次捡垃圾工作后将会死去。由于妻子的过世，他原本想安安静静得死在太空，成为新的太空垃圾，但妻子生前留下的信息动摇了他的想法……\n\n三 音乐音效设计思路\n\n由于比赛只有三天的制作时间，因此更多的聚焦在音乐效果的简单呈现。音乐风格保持合成器加少量真实乐器，力求营造孤寂的太空感。音效设计较少，仅设计抓取、丢弃、爆炸等简单音效。\n\n遗憾的是由于时间紧迫，大部分音乐音效并未实装。视频中展现全部的音乐效果，游戏Ludum Dare官网链接可通过下方按钮进入。";
        const cosmicDescEn = "This work is an entry for \"Ludum Dare 59\"\n\nBackground Introduction\n\nI. Level Gameplay\n\nPlayers control a spaceship to collect and sell garbage in space, in exchange for the information left by his wife and his own memories.\n\nII. Plot Narrative\n\nThe player is a spaceship employee engaged in garbage recycling in space, who is already seriously ill and will die after completing this garbage collection work. Due to the passing of his wife, he originally wanted to die quietly in space and become new space garbage, but the information left by his wife before her death shook his mind...\n\nIII. Music and Sound Effect Design Concept\n\nSince the production time of the competition is only three days, more focus is placed on the simple presentation of music effects. The music style adopts synthesizers plus a small number of real instruments, striving to create a lonely sense of space. There are few sound effect designs, only simple sound effects such as grabbing, discarding, and explosion are designed.\n\nUnfortunately, due to the tight schedule, most of the music and sound effects have not been implemented. \n\nAll the music effects are shown in the video, and the official Ludum Dare website link for the game can be accessed via the button below.";

            if (Math.hypot(x, z) > grassRadius - 3) return false;
            if (allPathPoints.some(point => Math.hypot(x - point.x, z - point.z) < 1.85 + padding * 0.35)) return false;

            if (lamps.some(lamp => Math.hypot(x - lamp.position.x, z - lamp.position.z) < 1.65 + padding)) return false;
            if (pathAnimalStaticObstacles.some(obstacle => Math.hypot(x - obstacle.x, z - obstacle.z) < obstacle.radius + padding)) return false;
            if (markers.some(marker => {
                if (marker === currentAnimal.group) return false;
                const model = marker.userData.info && marker.userData.info.model;
                const radius = model === 'spaceship' ? 5 : (model === 'cake' ? 4.4 : (model === 'gear' ? 4 : (model === 'profile' ? 4.2 : (model === 'orchestra-star' ? 1.35 : 3.2))));

        function fadeAmbientAudio(targetLevel, duration) {
            const token = ++ambientFadeToken;
            if (ambientFadeFrame) cancelAnimationFrame(ambientFadeFrame);
            const starts = ambientTracks.map(({ audio }) => audio.volume);
            const startTime = performance.now();
            const step = now => {
                if (token !== ambientFadeToken) return;
                const progress = duration <= 0 ? 1 : Math.min(1, (now - startTime) / duration);
                ambientTracks.forEach(({ audio, volume }, index) => {
                    audio.volume = starts[index] + (volume * targetLevel - starts[index]) * progress;
                });
                if (progress < 1) ambientFadeFrame = requestAnimationFrame(step);
                else ambientFadeFrame = 0;
            };
            ambientFadeFrame = requestAnimationFrame(step);
        }

                audio.volume = 0;

            });
            Promise.allSettled(playAttempts).then(results => {
                if (results.some(result => result.status === 'rejected')) ambientAudioStarted = false;

        function escapeResumeText(value) {
            return value.replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));

        function formatResume(text, language) {
            if (language === 'zh') {
                text = text.replace('何雨萱  /  Yuxuan HE', '何雨萱').replace('出生年份 · 2004', '出生年份：2004');
            } else {
                text = text.replace('Yuxuan HE  /  何雨萱', 'Yuxuan HE').replace('Born · 2004', 'Born: 2004');
            }

                ? ['教育背景', '实习经历', '实践经历', '联系方式']
                : ['EDUCATION', 'INTERNSHIP EXPERIENCE', 'PRACTICAL EXPERIENCE', 'CONTACT'];
            const rows = text.split('\n').map(row => row.trim()).filter(Boolean);
            const firstSectionIndex = rows.findIndex(row => labels.includes(row));
            const identityRows = firstSectionIndex > 0 ? rows.slice(0, firstSectionIndex) : [];
            const sections = new Map(labels.map(label => [label, []]));
            let current = null;
            rows.forEach(row => {
                if (sections.has(row)) current = row;
                else if (current) sections.get(current).push(row);
            });
            const card = (content, extra = '') => `<div class="rounded-xl border border-white/10 bg-slate-950/45 p-3 ${extra}">${content}</div>`;
            const sectionHeader = (index, title) => `<div class="mb-2 flex items-center gap-2"><span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-lg bg-violet-300/15 text-[9px] font-black tracking-wide text-violet-100">${index}</span><h4 class="text-[12px] font-black tracking-wide text-white">${title}</h4></div>`;
            const result = [];
            if (identityRows.length) {
                const name = escapeResumeText(identityRows[0]);
                const birth = escapeResumeText(identityRows[1] || '');
                result.push(`<section class="mb-1">${card(`<div class="text-[15px] font-black tracking-wide text-white">${name}</div><div class="mt-1 text-[10px] font-bold tracking-wide text-cyan-100/80">${birth}</div>`, 'border-cyan-200/25 bg-gradient-to-r from-cyan-300/[0.12] to-violet-300/[0.08]')}</section>`);
            }
            const education = sections.get(labels[0]) || [];
            result.push(`<section>${sectionHeader('01', labels[0])}${education.map(row => {
                const parts = row.split(/[｜|]/);
                const years = escapeResumeText(parts.shift() || '');
                const institution = escapeResumeText(parts.shift() || '');
                const details = escapeResumeText(parts.join('｜'));
                return card(`<div class="mb-1 text-[9px] font-black tracking-wider text-cyan-200">${years}</div><div class="text-[12px] font-extrabold leading-snug text-white">${institution}</div><div class="mt-1 text-[10px] leading-relaxed text-slate-300">${details}</div>`, 'mb-2');
            }).join('')}</section>`);
            const internshipRows = sections.get(labels[1]) || [];
            const jobs = [];
            let job = null;
            internshipRows.forEach(row => {
                if (row.startsWith('·')) { if (job) job.items.push(row.slice(1).trim()); }
                else if (/\d{4}.*(?:–|-)|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/i.test(row)) { if (job) job.date = row; }
                else { job = { title: row, date: '', items: [] }; jobs.push(job); }
            });
            result.push(`<section>${sectionHeader('02', labels[1])}${jobs.map(job => {

                const bullets = job.items.map(item => {

                    const body = splitAt >= 0 ? item.slice(splitAt + 1).trim() : item;
                    return `<div class="relative pl-3 text-[10px] leading-[1.65] text-slate-300 before:absolute before:left-0 before:top-[0.55em] before:h-1 before:w-1 before:rounded-full before:bg-cyan-300"><span class="font-bold text-slate-100">${escapeResumeText(lead)}</span>${lead ? (language === 'zh' ? '：' : ': ') : ''}${escapeResumeText(body)}</div>`;
                }).join('<div class="h-2"></div>');
                return card(`<div class="flex flex-wrap items-start justify-between gap-1"><div><div class="text-[12px] font-black text-white">${escapeResumeText(company || job.title)}</div>${role ? `<div class="mt-0.5 text-[10px] font-semibold text-cyan-100/85">${escapeResumeText(role)}</div>` : ''}</div><span class="rounded-full border border-cyan-200/20 bg-cyan-200/10 px-2 py-1 text-[8px] font-bold text-cyan-100">${escapeResumeText(job.date)}</span></div><div class="mt-2 border-t border-white/10 pt-2">${bullets}</div>`, 'mb-2');
            }).join('')}</section>`);
            const practiceItems = sections.get(labels[2]) || [];

                        : (language === 'zh' ? ['音乐设计', '音效设计', '场景化编曲'] : ['Music Design', 'Sound Design', 'Adaptive Scoring']));

                    : (isJam ? '72 HOUR JAM' : (isOrchestra ? 'ORCHESTRA' : 'INDIE GAMES'));
                return card(`<div class="mb-2 flex flex-wrap items-center justify-between gap-2"><div class="text-[12px] font-black text-white">${escapeResumeText(lead || (isJam ? 'Game Jam' : 'Independent Games'))}</div><span class="rounded-full border border-violet-200/25 bg-violet-200/10 px-2 py-1 text-[8px] font-black uppercase tracking-wider text-violet-100">${badge}</span></div><div class="text-[10px] leading-[1.75] text-slate-300">${bodyHtml}</div>${note ? `<div class="mt-2 border-l-2 border-violet-200/30 pl-2 text-[9px] leading-relaxed text-violet-100/65">${escapeResumeText(note)}</div>` : ''}<div class="mt-3 flex flex-wrap gap-1.5">${focusTags.map(tag => `<span class="rounded-full bg-cyan-200/10 px-2 py-1 text-[8px] font-bold text-cyan-100">${tag}</span>`).join('')}</div>`, 'border-violet-200/20 bg-gradient-to-br from-violet-300/[0.08] to-slate-950/55');
            }).join('')}</section>`);

        document.getElementById('port-close').addEventListener('click', () => {

        const moveSpeed = 0.375;
        const rotSpeed = 0.06;
        let forwardHeld = false;
        let reverseHeld = false;
        let autoTurnTarget = null;
        const reverseTurnRate = 0.105;
        let cameraYaw = catGroup.rotation.y;

        function animate() {
            requestAnimationFrame(animate);
            globalTime += 0.016; 

            // Ocean Wave Animation
            const positions = ocean.geometry.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                const x = positions.getX(i);
                const y = positions.getY(i); 
                const z = oceanInitZ[i] + Math.sin(x * 0.1 + globalTime * 1.5) * 0.4 + Math.cos(y * 0.1 + globalTime * 1.0) * 0.4;
                positions.setZ(i, z);
            }
            positions.needsUpdate = true;
            ocean.geometry.computeVertexNormals();

            const glintPositions = seaGlintsMesh.geometry.attributes.position.array;
            seaGlints.forEach((glint, i) => {
                glintPositions[i * 3] = glint.x + Math.sin(globalTime * 0.35 + glint.phase) * 1.2;
                glintPositions[i * 3 + 1] = Math.sin(glint.x * 0.1 + globalTime * 1.5) * 0.4 + Math.cos(glint.z * 0.1 + globalTime) * 0.4 + 0.12;
                glintPositions[i * 3 + 2] = glint.z;
            });
            seaGlintsMesh.geometry.attributes.position.needsUpdate = true;
            seaGlintMat.opacity = 0.3 + (Math.sin(globalTime * 1.3) + 1) * 0.12;
            // Boat Bobbing
            boatGroup.position.y = -1 + Math.sin(globalTime * 2) * 0.15;
            boatGroup.rotation.x = Math.sin(globalTime * 1.5) * 0.03;

            // Fireflies movement
            const ffPositions = fireflies.geometry.attributes.position.array;
            for(let i=0; i<fireflyCount; i++) {
                const init = firefliesInit[i];
                const t = globalTime * init.speed + init.phase;
                ffPositions[i*3] = init.x + Math.sin(t) * 2;
                ffPositions[i*3+1] = init.y + Math.cos(t * 0.8) * 1.5;
                ffPositions[i*3+2] = init.z + Math.sin(t * 1.2) * 2;
            }
            fireflies.geometry.attributes.position.needsUpdate = true;
            pathAnimals.forEach(animalState => {
                const { group, head, ears, tail, legs, kind, baseY, homeX, homeZ, phase } = animalState;
                const idle = globalTime * 1.4 + phase;
                if (!animalState.moving && globalTime >= animalState.nextMoveAt) {
                    for (let attempt = 0; attempt < 18 && !animalState.moving; attempt++) {
                        const direction = Math.random() * Math.PI * 2;
                        const radius = 0.45 + Math.random() * 0.8;
                        const targetX = homeX + Math.cos(direction) * radius;
                        const targetZ = homeZ + Math.sin(direction) * radius;
                        if (isPathAnimalSpotClear(targetX, targetZ, animalState)) {
                            animalState.targetX = targetX;
                            animalState.targetZ = targetZ;
                            animalState.moving = true;
                        }
                    }
                    if (!animalState.moving) animalState.nextMoveAt = globalTime + 1.5 + Math.random() * 2.5;
                }
                let walkSpeed = 0;
                if (animalState.moving) {
                    const dx = animalState.targetX - group.position.x;
                    const dz = animalState.targetZ - group.position.z;
                    const distance = Math.hypot(dx, dz);
                    if (distance < 0.045) {
                        group.position.x = animalState.targetX;
                        group.position.z = animalState.targetZ;
                        animalState.moving = false;
                        animalState.nextMoveAt = globalTime + 2 + Math.random() * 4;
                    } else {
                        const step = Math.min(distance, (kind === 'rabbit' ? 0.82 : 0.58) * 0.016);
                        const nextX = group.position.x + dx / distance * step;
                        const nextZ = group.position.z + dz / distance * step;
                        if (isPathAnimalSpotClear(nextX, nextZ, animalState, 0.72)) {
                            walkSpeed = kind === 'rabbit' ? 0.82 : 0.58;
                            group.position.x = nextX;
                            group.position.z = nextZ;
                            const desiredYaw = Math.atan2(-dx, -dz);
                            const yawDelta = Math.atan2(Math.sin(desiredYaw - group.rotation.y), Math.cos(desiredYaw - group.rotation.y));
                            group.rotation.y += yawDelta * 0.08;
                        } else {
                            animalState.moving = false;
                            animalState.nextMoveAt = globalTime + 0.8 + Math.random() * 1.2;
                        }
                    }
                } else {
                    const yawDelta = Math.atan2(Math.sin(animalState.homeRotation - group.rotation.y), Math.cos(animalState.homeRotation - group.rotation.y));
                    group.rotation.y += yawDelta * 0.025;
                }
                const walking = walkSpeed > 0;
                const stepCycle = globalTime * (kind === 'rabbit' ? 9 : 7) + phase;
                group.position.y = baseY + Math.sin(idle) * 0.018 + (walking ? Math.abs(Math.sin(stepCycle * 2)) * (kind === 'rabbit' ? 0.055 : 0.018) : 0);
                group.rotation.z = Math.sin(globalTime * 1.1 + phase) * 0.009;
                head.rotation.y = Math.sin(globalTime * 0.55 + phase) * 0.045;
                ears.forEach(({ group: ear, side }) => {
                    ear.rotation.z = ear.baseRotation + Math.sin(globalTime * 1.7 + phase + side) * (walking ? 0.045 : 0.025);
                });
                tail.rotation.x = (kind === 'fox' ? -0.28 : 0) + Math.sin(globalTime * (walking ? 3.4 : 1.8) + phase) * 0.055;
                legs.forEach(({ pivot, phase: legPhase }) => {
                    pivot.rotation.x = walking ? Math.sin(stepCycle + legPhase) * 0.34 : Math.sin(idle + legPhase) * 0.018;
                });
            });
            perchedBirds.forEach(({ bird, head, jaw, wings, feet, phase }) => {
                const idleCycle = (globalTime + phase) % 5.5;
                const flap = idleCycle < 1.1 ? Math.sin((idleCycle / 1.1) * Math.PI) : 0;
                bird.position.y = 6.02 + Math.sin(globalTime * 1.2 + phase) * 0.035;
                bird.rotation.y = Math.sin(globalTime * 0.32 + phase) * 0.055;
                const lookTurn = idleCycle > 1.25 && idleCycle < 2.35 ? Math.sin(((idleCycle - 1.25) / 1.1) * Math.PI) : 0;
                head.rotation.y = lookTurn * 0.72;
                const chirp = idleCycle > 2.55 && idleCycle < 3.55 ? Math.sin(((idleCycle - 2.55) / 1.0) * Math.PI) : 0;
                jaw.rotation.x = chirp * 0.72;
                wings.forEach(({ mesh, side }) => {
                    mesh.rotation.z = side * (0.08 + flap * 1.25);
                    mesh.rotation.x = flap * 0.35;
                });
                feet.forEach(({ mesh, side, baseY }) => {
                    const stepStart = side < 0 ? 1.55 : 3.85;
                    const stepWindow = idleCycle > stepStart && idleCycle < stepStart + 0.72;
                    const stepPhase = (idleCycle - stepStart) / 0.72;
                    const lift = stepWindow ? Math.sin(stepPhase * Math.PI) * 0.22 : 0;
                    mesh.position.y = baseY + lift;
                    mesh.rotation.z = side * lift * 1.8;
                });
            });
            foragingBirds.forEach(({ bird, head, jaw, wings, baseY, phase }) => {
                const peck = Math.pow(Math.max(0, Math.sin(globalTime * 2.2 + phase)), 8);
                bird.position.y = baseY - peck * 0.035 + Math.sin(globalTime * 1.1 + phase) * 0.012;
                head.rotation.x = 0.06 + peck * 0.62;
                head.rotation.y = Math.sin(globalTime * 0.55 + phase) * 0.12;
                jaw.rotation.x = -peck * 0.14;
                const flutter = Math.max(0, Math.sin(globalTime * 0.72 + phase + 1.3));
                wings.forEach(({ pivot, side }) => { pivot.rotation.z = side * (0.04 + flutter * 0.12); });
            });

            if (!isIntroPlaying) {
                // Cat Movement
                let isMoving = false;
                const movingForward = keys.w || keys.ArrowUp;
                const movingBackward = keys.s || keys.ArrowDown;
                const relativeFacing = Math.atan2(Math.sin(catGroup.rotation.y - cameraYaw), Math.cos(catGroup.rotation.y - cameraYaw));
                const facingViewer = Math.abs(relativeFacing) > Math.PI * 0.5;
                if (movingBackward && !reverseHeld && !facingViewer && autoTurnTarget === null) {
                    autoTurnTarget = catGroup.rotation.y + Math.PI;
                }
                if (movingForward && !forwardHeld && facingViewer && autoTurnTarget === null) {
                    autoTurnTarget = catGroup.rotation.y + Math.PI;
                }
                forwardHeld = movingForward;
                reverseHeld = movingBackward;
                if (autoTurnTarget !== null) {
                    const turnDelta = Math.atan2(Math.sin(autoTurnTarget - catGroup.rotation.y), Math.cos(autoTurnTarget - catGroup.rotation.y));
                    if (Math.abs(turnDelta) < reverseTurnRate) {
                        catGroup.rotation.y = autoTurnTarget;
                        autoTurnTarget = null;
                    } else {
                        catGroup.rotation.y += Math.sign(turnDelta) * reverseTurnRate;
                    }
                }
                // W/S movement is locked to the viewer's travel axis, independent of the cat's yaw.
                // Forward goes toward the island; backward goes toward the viewer, including during an auto-turn.
                if (movingForward && !movingBackward) {
                    catGroup.position.x -= Math.sin(cameraYaw) * moveSpeed;
                    catGroup.position.z -= Math.cos(cameraYaw) * moveSpeed;
                    isMoving = true;
                } else if (movingBackward && !movingForward) {
                    catGroup.position.x += Math.sin(cameraYaw) * moveSpeed;
                    catGroup.position.z += Math.cos(cameraYaw) * moveSpeed;
                    isMoving = true;
                }
                if (autoTurnTarget === null) {
                    if (keys.a || keys.ArrowLeft) { catGroup.rotation.y += rotSpeed; cameraYaw += rotSpeed; }
                    if (keys.d || keys.ArrowRight) { catGroup.rotation.y -= rotSpeed; cameraYaw -= rotSpeed; }
                }

                if (isMoving) {
                    catBody.position.y = 0.8 + Math.abs(Math.sin(globalTime * 20)) * 0.15;
                    catGroup.children[4].rotation.x = -Math.PI / 3 + Math.sin(globalTime * 15) * 0.3; // Tail
                } else {
                    catBody.position.y = 0.8;
                }

                // Bounds restriction
                const distFromCenter = Math.sqrt(catGroup.position.x ** 2 + catGroup.position.z ** 2);
                if (catGroup.position.z > pierZ - 5) {
                    catGroup.position.x = Math.max(Math.min(catGroup.position.x, 2.5), -2.5);
                    catGroup.position.z = Math.min(catGroup.position.z, pierZ + 8);
                } else if (distFromCenter > grassRadius - 1) {
                    const angleToCenter = Math.atan2(catGroup.position.x, catGroup.position.z);
                    catGroup.position.x = Math.sin(angleToCenter) * (grassRadius - 1);
                    catGroup.position.z = Math.cos(angleToCenter) * (grassRadius - 1);
                }

                // Spotlight Target Update
                const forwardVec = new THREE.Vector3(0, -1, -25);
                forwardVec.applyMatrix4(catGroup.matrixWorld);
                lightTarget.position.copy(forwardVec);

                // 3rd Person Camera Lerp
                const idealOffset = new THREE.Vector3(0, 7, 16).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraYaw).add(catGroup.position);
                const idealLookAt = new THREE.Vector3(0, 2, -15).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraYaw).add(catGroup.position);
                
                currentCameraPos.lerp(idealOffset, 0.08);
                currentLookAt.lerp(idealLookAt, 0.1);
                
                // Portfolio Proximity Check
                let nearAnyMarker = false;
                markers.forEach(marker => {
                    const isCake = marker.userData.info.model === 'cake';
                    const isProfile = marker.userData.info.model === 'profile';
                    const isPaperCrane = marker.userData.info.model === 'paper-crane';
                    const isOrchestraStar = marker.userData.info.model === 'orchestra-star';
                    if (!isProfile) marker.position.y = marker.userData.originalY + Math.sin(globalTime * 2.2 + marker.userData.phase) * (isCake ? 0.13 : (isOrchestraStar ? 0.035 : 0.4));
                    if (isCake) {
                        marker.rotation.x = Math.PI / 4 + Math.sin(globalTime * 1.25 + marker.userData.phase) * 0.035;
                        marker.rotation.z = 0.06 + Math.sin(globalTime * 1.05 + marker.userData.phase * 0.7) * 0.035;
                    } else if (marker.userData.info.model === 'diver') {
                        marker.rotation.x = Math.sin(globalTime * 0.8 + marker.userData.phase) * 0.035;
                        marker.rotation.y += 0.004;
                        marker.rotation.z = 0.045;
                    } else if (isPaperCrane) {
                        marker.rotation.x = Math.sin(globalTime * 0.75 + marker.userData.phase) * 0.035;
                        marker.rotation.z = Math.sin(globalTime * 0.6 + marker.userData.phase) * 0.025;
                        marker.rotation.y += 0.006;
                        marker.userData.paperWingPivots.forEach(({ wing, side, phase }) => {
                            wing.rotation.z = side * (0.025 + Math.sin(globalTime * 1.8 + phase) * 0.04);
                        });
                    } else if (isOrchestraStar) {
                        marker.rotation.z = Math.sin(globalTime * 1.1 + marker.userData.phase) * 0.035;
                        marker.rotation.y += 0.003;
                    } else if (!isProfile) marker.rotation.x += 0.01;
                    if (!isProfile && !isOrchestraStar && marker.userData.info.model !== 'diver' && !isPaperCrane) marker.rotation.y += isCake ? 0.012 : 0.015;

                    const markerDistance = catGroup.position.distanceTo(marker.position);
                    const isNear = isProfile
                        ? markerDistance < (activePortfolio === marker.userData.info.id ? 11 : 8.5)
                        : markerDistance < (isOrchestraStar ? 4.8 : 5.5);
                    const showcase = marker.userData.showcase;
                    if (showcase) {
                        showcase.level += ((isNear ? 1 : 0) - showcase.level) * 0.065;
                        showcase.spot.intensity = 1.65 + showcase.level * 3.0;
                        showcase.fill.intensity = 2.45 + showcase.level * 2.8;
                        showcase.baseMat.emissiveIntensity = 0.3 + showcase.level * 0.75;
                        showcase.trimMat.emissiveIntensity = 0.72 + showcase.level * 1.55;
                        showcase.groundHalo.material.opacity = 0.14 + showcase.level * 0.28;
                    }
                    if (isNear) {
                        nearAnyMarker = true;
                        if (!isProfile) { const hoverScale = isOrchestraStar ? 1.06 : 1.4; marker.scale.lerp(new THREE.Vector3(hoverScale, hoverScale, hoverScale), 0.1); }
                        
                        if (activePortfolio !== marker.userData.info.id) {
                            activePortfolio = marker.userData.info.id;
                            const data = marker.userData.info;
                            const isOrchestra = data.model === 'orchestra-star';
                            const isOrchestraVideo = isOrchestra && Boolean(data.videoId);
                            const isOrchestraChannel = isOrchestra && Boolean(data.channel);
                            activePortfolioInfo = data;
                            portfolioVideoActive = false;
                            fadeAmbientAudio(isOrchestraVideo ? 0 : 1, isOrchestraVideo ? 1000 : 3000);
                            portVideo.pause();
                            portVideo.removeAttribute('src');
                            portVideo.load();
                            portVideo.classList.add('hidden');
                            portBilibiliFrame.removeAttribute('src');
                            portBilibiliFrame.classList.add('hidden');
                            portMediaShell.classList.toggle('hidden', isProfile || isOrchestraChannel);
                            uiElements.extraLinks.classList.toggle('hidden', !isOrchestraChannel);
                            selectedPortfolioVideo = data.videos && data.videos.length ? data.videos[0].src : data.video;
                            portVideoList.replaceChildren();
                            portVideoList.classList.toggle('hidden', !data.videos || !data.videos.length || isProfile);
                            if (data.videos && data.videos.length) {
                                data.videos.forEach((video, videoIndex) => {
                                    const choice = document.createElement('button');
                                    choice.type = 'button';
                                    const videoTitles = siteLanguage === 'zh'
                                        ? ['剧情片段 · 飞船电台音乐', '开屏 · 太空启程', '太空结局 · 成为星辰', '回家结局']
                                        : ['Story & Ship Radio', 'Opening · Out of the Earth', 'Space Ending · Be a Star', 'Home Ending · Back Home'];
                                    choice.textContent = videoTitles[videoIndex] || video.title;
                                    choice.className = 'min-h-10 rounded-xl border px-3 py-2 text-left text-[10px] font-bold leading-tight transition-colors ' + (videoIndex === 0 ? 'border-sky-300/80 bg-sky-300/20 text-white' : 'border-white/15 bg-white/5 text-gray-300 hover:bg-white/10');

                                uiElements.descZh.parentElement.className = 'rounded-2xl border border-violet-200/20 bg-gradient-to-br from-violet-300/[0.08] to-cyan-300/[0.035] p-3';
                                uiElements.descEn.parentElement.className = 'rounded-2xl border border-cyan-200/20 bg-gradient-to-br from-cyan-300/[0.07] to-violet-300/[0.035] p-3';
                                uiElements.descZh.classList.remove('whitespace-pre-line');
                                uiElements.descEn.classList.remove('whitespace-pre-line');
                                uiElements.descZh.innerHTML = formatResume(data.descZh, 'zh');

                                uiElements.descEn.textContent = data.descEn;
                            }
                            uiElements.descZh.parentElement.classList.toggle('hidden', siteLanguage !== 'zh');
                            uiElements.descEn.parentElement.classList.toggle('hidden', siteLanguage !== 'en');
                            document.getElementById('port-desc').classList.toggle('hidden', isOrchestraChannel);
                            uiElements.resumeContact.classList.toggle('hidden', !isProfile);
                            uiElements.badge.style.color = data.hex;
                            uiElements.link.style.backgroundColor = data.hex;
                            uiElements.link.classList.toggle('hidden', !data.link);
                            uiOverlay.classList.add('active');
                        }
                    } else {
                        if (!isProfile) marker.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
                    }
                });

                if (!nearAnyMarker && activePortfolio !== null) {
                    activePortfolio = null;
                    activePortfolioInfo = null;
                    portfolioVideoActive = false;
                    fadeAmbientAudio(1, 3000);
                    portVideo.pause();
                    portVideo.removeAttribute('src');
                    portVideo.load();
                    portBilibiliFrame.removeAttribute('src');
                    portBilibiliFrame.classList.add('hidden');
                    selectedPortfolioVideo = null;
                    portVideoList.replaceChildren();
                    portVideoList.classList.add('hidden');
                    portVideo.classList.add('hidden');
                    playContainer.classList.remove('hidden');
                    uiElements.play.classList.remove('hidden');
                    uiElements.extraLinks.classList.add('hidden');
                    uiOverlay.classList.remove('active');
                }
            }

            camera.position.copy(currentCameraPos);
            camera.lookAt(currentLookAt);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
